<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSL Portal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0d1b2a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .portal-card {
      background-color: #1b263b;
      width: 100%;
      max-width: 400px;
      border-radius: 28px;
      padding: 36px 24px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .logo-wrapper {
      width: 86px;
      height: 86px;
      background-color: #ffffff;
      border-radius: 50%;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      padding: 8px;
    }

    .logo-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .portal-title {
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .portal-subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 30px;
    }

    .category-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 32px;
    }

    .option-card {
      display: flex;
      align-items: center;
      background-color: #ffffff;
      border-radius: 18px;
      padding: 16px 20px;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }

    .option-card:active {
      transform: scale(0.98);
    }

    .icon-box {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      margin-right: 16px;
      flex-shrink: 0;
    }

    .icon-blue {
      background-color: #e0f2fe;
    }

    .icon-orange {
      background-color: #ffedd5;
    }

    .text-content {
      flex: 1;
      text-align: left;
    }

    .text-title {
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 3px;
    }

    .text-desc {
      font-size: 12px;
      color: #64748b;
    }

    .arrow-icon {
      color: #94a3b8;
      font-size: 18px;
      font-weight: bold;
    }

    .footer-text {
      font-size: 11px;
      color: #64748b;
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>

  <div class="portal-card">
    <!-- CSL ലോഗോ -->
    <div class="logo-wrapper">
      <img src="https://upload.wikimedia.org/wikipedia/en/thumb/f/fa/Cochin_Shipyard_Limited_Logo.svg/512px-Cochin_Shipyard_Limited_Logo.svg.png" alt="CSL Logo">
    </div>

    <!-- തലക്കെട്ടുകൾ -->
    <h1 class="portal-title">CSL Portal</h1>
    <p class="portal-subtitle">Please select your employment category</p>

    <!-- സെലക്ഷൻ ബട്ടണുകൾ -->
    <div class="category-group">
      <!-- Permanent Employees -->
      <a href="permanent_login.html" class="option-card">
        <div class="icon-box icon-blue">🏢</div>
        <div class="text-content">
          <div class="text-title">Permanent Employees</div>
          <div class="text-desc">Full access & benefits</div>
        </div>
        <div class="arrow-icon">➔</div>
      </a>

      <!-- Company on Contract -->
      <a href="contract_login.html" class="option-card">
        <div class="icon-box icon-orange">📋</div>
        <div class="text-content">
          <div class="text-title">Company on Contract</div>
          <div class="text-desc">Contractual staff services</div>
        </div>
        <div class="arrow-icon">➔</div>
      </a>
    </div>

    <!-- കോപ്പിറൈറ്റ് -->
    <p class="footer-text">© 2026 Cochin Shipyard Limited • All Rights Reserved</p>
  </div>

</body>
</html>
