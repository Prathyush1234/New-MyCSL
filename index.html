<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My CSL Login</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: linear-gradient(180deg, #f0f4f8 0%, #d9e2ec 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .app-container {
      background-color: #ffffff;
      width: 100%;
      max-width: 380px;
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      padding: 32px 24px;
      text-align: center;
    }
    .logo-container {
      margin-bottom: 20px;
    }
    .logo-container img {
      width: 90px;
      height: 90px;
      object-fit: contain;
    }
    .app-title {
      font-size: 22px;
      font-weight: 700;
      color: #0b3c68;
      margin-bottom: 4px;
    }
    .app-subtitle {
      font-size: 13px;
      color: #627d98;
      margin-bottom: 24px;
    }
    .employee-type-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .radio-card {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 8px;
      border: 1.5px solid #dce4ec;
      border-radius: 10px;
      background-color: #f8fafc;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      color: #334e68;
    }
    .radio-card input[type="radio"] {
      accent-color: #0b3c68;
    }
    .input-group {
      margin-bottom: 16px;
      text-align: left;
    }
    .input-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #334e68;
      margin-bottom: 6px;
    }
    .input-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #dce4ec;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
    }
    .input-group input:focus {
      border-color: #0b3c68;
    }
    .login-btn {
      width: 100%;
      padding: 14px;
      background-color: #0b3c68;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="logo-container">
      <img src="logo.png" alt="My CSL Logo" onerror="this.style.display='none'">
      <h1 class="app-title">My CSL</h1>
      <p class="app-subtitle">Cochin Shipyard Limited</p>
    </div>

    <form>
      <!-- എംപ്ലോയി ടൈപ്പ് സെലക്ഷൻ -->
      <div class="employee-type-group">
        <label class="radio-card">
          <input type="radio" name="emp_type" value="permanent" checked>
          <span>Permanent</span>
        </label>
        <label class="radio-card">
          <input type="radio" name="emp_type" value="contract">
          <span>Contract</span>
        </label>
      </div>

      <!-- ഇൻപുട്ട് ഫീൽഡുകൾ -->
      <div class="input-group">
        <label for="empId">Employee ID / User ID</label>
        <input type="text" id="empId" placeholder="Enter Employee ID" required>
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter Password" required>
      </div>

      <button type="button" class="login-btn">Sign In</button>
    </form>
  </div>

</body>
</html>
